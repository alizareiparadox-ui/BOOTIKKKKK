<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gang Focus | پنل گنگ مدیریت کارها</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ذرات کانفتی -->
    <canvas id="confettiCanvas"></canvas>

    <main class="app">
        <!-- هدر -->
        <div class="app-header">
            <h1 class="app-title">⚡ GANG FOCUS</h1>
            <p class="app-subtitle">تیک بزن ، جلو برو ، بدرخش</p>
            <div class="date-row">
                <span class="shamsi-date" id="shamsiDate">📅 </span>
                <span class="live-clock" id="liveClock">🕐 </span>
            </div>
        </div>

        <!-- استریک و امتیاز -->
        <div class="stats-row">
            <div class="stat-card">
                <span class="stat-icon">🔥</span>
                <span class="stat-value" id="streakCount">0</span>
                <span class="stat-label">روز پشت سر هم</span>
            </div>
            <div class="stat-card">
                <span class="stat-icon">⭐</span>
                <span class="stat-value" id="totalScore">0</span>
                <span class="stat-label">امتیاز کل</span>
            </div>
            <div class="stat-card">
                <span class="stat-icon">⏱️</span>
                <span class="stat-value" id="todayStudyTime">0 دقیقه</span>
                <span class="stat-label">مطالعه امروز</span>
            </div>
        </div>

        <!-- نقل قول انگیزشی -->
        <div class="quote-panel">
            <div class="quote-text" id="quoteText">"ذهن مانند چتر نجات است؛ وقتی باز شود بهتر کار می‌کند."</div>
            <div class="quote-author" id="quoteAuthor">— فرانک زاپا</div>
        </div>

        <!-- تایمر پومودورو -->
        <div class="timer-panel">
            <span class="timer-mode-badge" id="modeLabel">📚 مطالعه</span>
            <div class="timer-clock" id="timerDisplay">25:00</div>
            <div class="timer-actions">
                <button class="btn btn-primary" id="startPauseBtn">▶ شروع</button>
                <button class="btn btn-outline" id="resetBtn">↺ بازنشانی</button>
                <button class="btn btn-outline" id="switchModeBtn">🔄 استراحت</button>
            </div>
            <div class="auto-pomodoro">
                <label class="toggle-label">
                    <input type="checkbox" id="autoPomodoroCheck">
                    <span>چرخه خودکار (۲۵ دقیقه مطالعه + ۵ دقیقه استراحت)</span>
                </label>
            </div>
        </div>

        <!-- نمودار دایره‌ای -->
        <div class="chart-area">
            <canvas id="progressCanvas" width="180" height="180"></canvas>
            <span class="chart-percent" id="chartPercentLabel">0%</span>
        </div>

        <!-- مدیریت کارها -->
        <div class="task-header">
            <h3>📋 کارهای تو</h3>
            <span class="task-counter" id="taskCounterDisplay">۰ کار</span>
        </div>

        <div class="add-task-row">
            <input
                type="text"
                class="task-input"
                id="taskInputField"
                placeholder="اسم درس یا وظیفه..."
                autocomplete="off"
            >
            <button class="btn-add" id="addTaskButton">➕ افزودن</button>
        </div>

        <ul class="task-list" id="taskListContainer">
            <li class="empty-message">هنوز کاری اضافه نکردی 🧠</li>
        </ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
